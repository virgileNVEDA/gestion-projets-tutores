{% extends "base.html" %}
{% block title %}Accueil · Projets tutorés{% endblock %}
{% block public_content %}
<main class="orbit-home">
  <header class="orbit-header">
    <a class="orbit-brand" href="/" aria-label="Accueil"><span class="orbit-brand-mark">GP</span><span>PROJETS <b>TUTORÉS</b></span></a>
    <a class="orbit-login" href="{{ url_for('auth.login') }}" aria-label="Se connecter" title="Se connecter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </a>
  </header>

  <section class="orbit-stage" aria-label="Carrousel circulaire d’images">
    <div class="orbit-glow"></div>
    <div class="orbit-ring orbit-ring-outer">
      <div class="orbit-thumbnails">
        <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=180&h=180&fit=crop" alt="Étudiants sur un campus">
        <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=180&h=180&fit=crop" alt="Livres et documentation">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=180&h=180&fit=crop" alt="Travail numérique">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=180&h=180&fit=crop" alt="Étudiants en groupe">
        <img src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=180&h=180&fit=crop" alt="Bibliothèque">
        <img src="https://images.unsplash.com/photo-1513258496099-48168024c7ca?w=180&h=180&fit=crop" alt="Salle de cours">
        <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?w=180&h=180&fit=crop" alt="Formation informatique">
        <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?w=180&h=180&fit=crop" alt="Enseignement">
        <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=180&h=180&fit=crop" alt="Étude et apprentissage">
        <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=180&h=180&fit=crop" alt="Collaboration étudiante">
        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=180&h=180&fit=crop" alt="Recherche et rédaction">
        <img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=180&h=180&fit=crop" alt="Travail académique">
      </div>
    </div>
    <div class="orbit-ring orbit-ring-inner"></div>
    <div class="orbit-center">
      <div class="orbit-center-image orbit-image-one"></div>
      <div class="orbit-center-image orbit-image-two"></div>
      <div class="orbit-center-image orbit-image-three"></div>
      <div class="orbit-center-shade"></div>
      <div class="orbit-center-caption"><span>ESPACE ACADÉMIQUE</span><strong>Projets & mémoires</strong><small>Concevoir · Encadrer · Réussir</small></div>
    </div>
    <span class="orbit-spark orbit-spark-one"></span><span class="orbit-spark orbit-spark-two"></span><span class="orbit-spark orbit-spark-three"></span>
  </section>

  <div class="orbit-bottom">
    <span class="orbit-bottom-line"></span>
    <p>Une plateforme pour faire grandir les idées et valoriser la recherche.</p>
    <span class="orbit-bottom-line"></span>
  </div>
</main>
{% endblock %}
